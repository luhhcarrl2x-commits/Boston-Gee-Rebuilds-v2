name: Build SHRP Reborn for Moto G Stylus 5G (2024)

on:
  workflow_dispatch:
    inputs:
      device_tree:
        description: "Device tree repository (owner/repo)"
        required: true
        default: "PizzaG/android_device_motorola_boston"
        type: string

      device_branch:
        description: "Device tree branch"
        required: true
        default: "TWRP"
        type: string

      build_target:
        description: "Build target"
        required: true
        default: "recoveryimage"
        type: choice
        options:
          - recoveryimage
          - bootimage
          - vendorbootimage

permissions:
  contents: write

jobs:
  build:
    name: Build SHRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: boston
      RECOVERY_MANIFEST: https://github.com/SHRP-Reborn/manifest.git
      RECOVERY_BRANCH: shrp-12.1
      TZ: UTC

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Validate device tree settings
        shell: bash
        run: |
          set -euo pipefail
          echo "Device: $DEVICE"
          echo "Device tree: ${{ inputs.device_tree }}"
          echo "Device branch: ${{ inputs.device_branch }}"
          echo "Build target: ${{ inputs.build_target }}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools unzip xz-utils zip zlib1g-dev \
            python3 python-is-python3 openjdk-17-jdk

      - name: Install Repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize SHRP source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery
          cd /tmp/recovery
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u "$RECOVERY_MANIFEST" -b "$RECOVERY_BRANCH"

      - name: Sync SHRP source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/recovery
          repo sync -c --no-clone-bundle --no-tags \
            --optimized-fetch --prune -j2

      - name: Clone device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery/device/motorola
          git clone \
            --depth=1 \
            --branch "${{ inputs.device_branch }}" \
            "https://github.com/${{ inputs.device_tree }}.git" \
            /tmp/recovery/device/motorola/boston

      - name: Check device tree files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/recovery/device/motorola/boston
          echo "Device tree files:"
          ls -la
          if [[ ! -f BoardConfig.mk ]]; then
            echo "::error::BoardConfig.mk is missing."
            exit 1
          fi

      - name: Prepare output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery/out/target/product/boston
          chmod -R u+rwX,go+rX /tmp/recovery/out || true

      - name: Build SHRP recovery
        shell: bash
        run: |
          # Android envsetup scripts may reference unset variables.
          set -eo pipefail
          cd /tmp/recovery
          source build/envsetup.sh
          lunch twrp_boston-eng
          mka "${{ inputs.build_target }}" -j2

      - name: Fix recovery output permissions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="/tmp/recovery/out/target/product/boston"

          if sudo test -d "$OUT_DIR"; then
            sudo chmod -R a+rX "$OUT_DIR" || true
            sudo find "$OUT_DIR" -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "*.txt" \) \
              -exec chmod a+r {} \; || true
            echo "Recovery output permissions checked."
          else
            echo "Recovery output directory not found."
          fi

      - name: Collect build output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="/tmp/recovery/out/target/product/boston"
          DEST="$GITHUB_WORKSPACE/build-output"

          mkdir -p "$DEST"
          echo "BUILD_STATUS=FAILED" >> "$GITHUB_ENV"

          if [[ -d "$OUT_DIR" ]]; then
            sudo find "$OUT_DIR" -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "*.txt" \) \
              -exec cp -f {} "$DEST/" \; || true
          fi

          if find "$DEST" -maxdepth 1 -type f \
            \( -name "*.img" -o -name "*.zip" \) | grep -q .; then
            echo "BUILD_STATUS=SUCCESS" >> "$GITHUB_ENV"
            echo "Build output collected:"
            ls -lh "$DEST"
          else
            echo "No recovery image or ZIP was found."
            echo "Available output files:"
            find "$OUT_DIR" -maxdepth 4 -type f 2>/dev/null | head -100 || true
          fi

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-Reborn-Boston
          path: build-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-Build-Logs
          path: |
            /tmp/recovery/.repo/
            /tmp/recovery/out/target/product/boston/*.log
          if-no-files-found: ignore
          retention-days: 7
